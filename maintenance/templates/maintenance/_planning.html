{% comment %}
Planning FullCalendar réutilisable.
Paramètres : events_url (source JSON, ex. api_events?technician=<pk>), planning_id (id du conteneur).
{% endcomment %}
{% include "maintenance/_planning_assets.html" %}

<div class="smo-planning-layout">
    {% include "maintenance/_planning_legend.html" %}
    <div id="{{ planning_id }}" class="smo-planning-main"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('{{ planning_id|escapejs }}');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            locale: 'fr',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            // Pas de ligne « Toute la journée » : les interventions ont toujours un créneau horaire.
            allDaySlot: false,
            // Ligne rouge de l'heure actuelle (couleur dans _planning_assets.html).
            nowIndicator: true,
            slotMinTime: '07:00:00',
            slotMaxTime: '20:00:00',
            // Interventions qui se chevauchent (urgence) : côte à côte, chacune sur la moitié de la largeur.
            slotEventOverlap: false,
            events: '{{ events_url|escapejs }}',
            eventClick: function(info) {
                if (info.event.id) {
                    window.location.href = "/maintenance/tickets/" + info.event.id + "/";
                }
            }
        });
        calendar.render();
    });
</script>
