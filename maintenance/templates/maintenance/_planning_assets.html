{% comment %}
Feuilles de style et scripts FullCalendar partagés par les plannings.
{% endcomment %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales/fr.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales/nl.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales/en-gb.js'></script>
<script>
    // Langue des plannings = langue de l'utilisateur (anglais : en-gb, semaine au lundi et 24 h).
    window.SMO_CALENDAR_LOCALE = '{% if LANGUAGE_CODE == "en" %}en-gb{% else %}{{ LANGUAGE_CODE|default:"fr"|escapejs }}{% endif %}';
</script>

<style>
    :root {
        --fc-border-color: #f1f5f9;
        --fc-button-bg-color: #0f172a;
        --fc-button-border-color: #0f172a;
        --fc-button-hover-bg-color: #1e293b;
        --fc-button-hover-border-color: #1e293b;
        --fc-button-active-bg-color: #3b82f6;
        --fc-button-active-border-color: #3b82f6;
        --fc-event-bg-color: #3b82f6;
        --fc-event-border-color: #3b82f6;
        --fc-now-indicator-color: #ef4444;
    }
    /* Week-end en gris (colonnes de la semaine et cases du mois). */
    .fc .fc-timegrid-col.fc-day-sat,
    .fc .fc-timegrid-col.fc-day-sun,
    .fc .fc-daygrid-day.fc-day-sat,
    .fc .fc-daygrid-day.fc-day-sun,
    .fc .fc-col-header-cell.fc-day-sat,
    .fc .fc-col-header-cell.fc-day-sun {
        background: #f1f5f9;
    }
    /* Ligne de l'heure actuelle un peu plus visible que le trait par défaut. */
    .fc .fc-timegrid-now-indicator-line { border-top-width: 2px; }
    .fc .fc-toolbar-title {
        font-weight: 900;
        letter-spacing: -0.025em;
        color: #1e293b;
        text-transform: capitalize;
    }
    .fc .fc-col-header-cell-cushion {
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #94a3b8;
        padding: 10px 0;
    }
    .fc-theme-standard td, .fc-theme-standard th {
        border: 1px solid #f8fafc;
    }
    .fc-v-event {
        border-radius: 8px;
        padding: 2px 5px;
        border: none;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    /* Tuiles d'intervention : bandeau gauche = type, fond pastel et lampe en haut à droite = statut. */
    .smo-tile {
        --smo-band: #93c5fd;
        --smo-bg: #ffffff;
        --smo-text: #1e293b;
        --smo-lamp: #3b82f6;
    }
    .smo-type-maintenance { --smo-band: #93c5fd; }
    .smo-type-repair { --smo-band: #c4b5fd; }
    .smo-type-emergency { --smo-band: #fca5a5; }
    .smo-status-pending { --smo-bg: #f8fafc; --smo-text: #64748b; --smo-lamp: #cbd5e1; }
    .smo-status-planned { --smo-bg: #ffffff; --smo-lamp: #3b82f6; }
    .smo-status-in_progress { --smo-bg: #dcfce7; --smo-lamp: #16a34a; }
    .smo-status-done { --smo-bg: #f1f5f9; --smo-text: #64748b; --smo-lamp: #64748b; }
    .smo-status-to_reschedule { --smo-bg: #ffedd5; --smo-lamp: #f97316; }
    .smo-status-canceled { --smo-bg: #f8fafc; --smo-text: #94a3b8; --smo-lamp: #94a3b8; }

    /* Lampe de statut : pastille dans le coin supérieur droit de la tuile. */
    .fc .smo-tile::after,
    .smo-lamp {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--smo-lamp);
        box-shadow: 0 0 0 2px var(--smo-bg), 0 0 6px var(--smo-lamp);
    }
    /* FullCalendar utilise aussi ::after (voile de la tuile sélectionnée) : on garde la pastille. */
    .fc .smo-tile::after,
    .fc .smo-tile.fc-event-selected::after,
    .fc .smo-tile:focus::after { position: absolute; top: 3px; right: 3px; left: auto; bottom: auto; z-index: 2; }
    .fc .smo-tile .fc-event-main,
    .fc .fc-daygrid-event.smo-tile { padding-right: 12px; }
    .smo-lamp { display: inline-block; flex-shrink: 0; }
    /* En cours : la lampe pulse. */
    .fc .smo-status-in_progress::after,
    .smo-status-in_progress .smo-lamp { animation: smo-lamp-pulse 1.6s ease-in-out infinite; }
    @keyframes smo-lamp-pulse { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
        .fc .smo-status-in_progress::after,
        .smo-status-in_progress .smo-lamp { animation: none; }
    }
    .fc .fc-v-event.smo-tile {
        background: var(--smo-bg);
        border: 1px solid #e2e8f0;
        border-left: 5px solid var(--smo-band);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .fc .fc-v-event.smo-tile .fc-event-main,
    .fc .fc-daygrid-event.smo-tile {
        color: var(--smo-text);
    }
    .fc .fc-daygrid-event.smo-tile .fc-daygrid-event-dot {
        border-color: var(--smo-band);
    }
    .fc .fc-daygrid-block-event.smo-tile {
        background: var(--smo-bg);
        border: 1px solid #e2e8f0;
        border-left: 5px solid var(--smo-band);
    }
    .smo-status-canceled .fc-event-title { text-decoration: line-through; }

    /* Vues Semaine et Jour : au survol, une tuile courte (intervention de quelques minutes)
       reprend une taille lisible et passe au-dessus des autres, avec tout son texte. */
    .fc .fc-timegrid-event-harness:hover { z-index: 20 !important; }
    .fc .fc-timegrid-event-harness > .fc-timegrid-event.smo-tile:hover {
        bottom: auto;
        height: auto;
        min-height: max(100%, 4.5rem);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.15), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-main { height: auto; }
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-main-frame {
        height: auto;
        flex-direction: column;
        overflow: visible;
    }
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-time::after { content: none; }
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-time,
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-title {
        max-height: none;
        overflow: visible;
        white-space: normal;
    }
    .fc .fc-timegrid-event.smo-tile:hover .fc-event-title { font-size: inherit; }

    /* Planning avec sa légende à gauche (au-dessus sur écran étroit). */
    .smo-planning-layout { display: flex; flex-direction: column; gap: 1.5rem; }
    .smo-planning-main { flex: 1; min-width: 0; }
    @media (min-width: 1024px) {
        .smo-planning-layout { flex-direction: row; align-items: flex-start; }
        .smo-planning-layout > .smo-legend { width: 11rem; flex-shrink: 0; flex-direction: column; margin-top: 4.5rem; }
        .smo-planning-layout > .smo-legend .smo-legend-group { flex-direction: column; align-items: flex-start; }
    }

    /* Légende du planning */
    .smo-legend { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; font-size: 12px; color: #475569; }
    .smo-legend-group { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
    .smo-legend-title { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; }
    .smo-legend-item { display: inline-flex; align-items: center; gap: 0.5rem; }
    .smo-legend-swatch { position: relative; width: 22px; height: 16px; border-radius: 4px; border: 1px solid #e2e8f0; flex-shrink: 0; }
    .smo-legend-swatch.is-band { border: none; border-left: 5px solid var(--smo-band); background: #ffffff; box-shadow: inset 0 0 0 1px #e2e8f0; }
    .smo-legend-swatch.is-status { background: var(--smo-bg); }
    .smo-legend-swatch.is-status .smo-lamp { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; }
</style>
